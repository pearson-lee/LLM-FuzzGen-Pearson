# MODEL_NAME: "gemini-3.1-flash"
MODEL_NAME: "gemini-2.5-flash"
OLLAMA_MODEL: "qwen3:32b"
OPENROUTER_MODEL: "deepseek/deepseek-r1-0528:floor"
MAX_TOKENS: 32768
THINK_BUDGET_TOKEN: 8192 # Setting the thinkingBudget to -1 turns on dynamic thinking on Gemini
FUZZ_TARGET_TEMPERATURE: 0.5
BLOCKER_CLASSIFIER_TEMPERATURE: 0.1
BLOCKER_TRIAGE_PARSE_MAX_RETRIES: 2
BLOCKER_TRIAGE_PARSE_RETRY_DELAY_SEC: 2.0
SEED_GENERATOR_INITIAL_TEMPERATURE: 0.4
SEED_GENERATOR_LATER_TEMPERATURE: 0.5
INTROSPECTOR_API_BASE_URL: "http://localhost:8080/api"
MIN_COVERAGE_IMPROVEMENT: 1.00  # Minimum coverage improvement to consider progress

# Coverage-guided fuzz target generation settings (main.py process).
COVERAGE_ITERATION_LOOP: 100
COVERAGE_FUZZ_TARGET_COMPILER_MAX_ATTEMPTS: 10
COVERAGE_NO_GROWTH_STOP_THRESHOLD: 10

# Blocker solver settings (run_all_fuzzer --use-blocker / run_blocker_once).
BLOCKER_MAX_ITERATIONS: 3
BLOCKER_FUZZ_TARGET_COMPILER_MAX_ATTEMPTS: 4
BLOCKER_NO_GROWTH_STOP_THRESHOLD: 3
BLOCKER_TARGET_RUNTIME_SANITY_SECONDS: 10

# Vertex AI Google Cloud settings
VERTEXAI_PROJECT_ID: "project-7593333e-b728-4561-b67"
VERTEXAI_LOCATION: "us-central1"
